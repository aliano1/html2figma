# html2figma capture server — Fly.io
# Deploy:  fly launch --copy-config --no-deploy && fly secrets set H2F_API_KEY=... && fly deploy
# Regions: fly scale count 1 --region iad,ams   (add more any time)
app = "html2figma-capture"          # change to your app name
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  H2F_MAX_INFLIGHT = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"       # scale to zero when idle
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 2
    hard_limit = 4

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
