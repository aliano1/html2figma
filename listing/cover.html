<!doctype html><meta charset="utf-8">
<style>
body{margin:0;width:1920px;height:1080px;background:#F6F6F4;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111;overflow:hidden;position:relative}
.wrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:0 140px;gap:80px}
.brand{position:absolute;top:96px;left:140px;display:flex;align-items:center;gap:18px;font-weight:700;font-size:36px;letter-spacing:-.01em}
.brand img{width:56px;height:56px;border-radius:12px}
h1{font-size:88px;line-height:1.02;letter-spacing:-.03em;margin:0 0 30px;font-weight:700}
p{font-size:32px;line-height:1.4;color:#555;margin:0;max-width:620px}
.fig{display:grid;grid-template-columns:1fr auto 1fr;gap:34px;align-items:center;transform:scale(1.55);transform-origin:center}
.win{border:2px solid #E2E0DA;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.08)}.win .bar{height:30px;background:#F1F0EB;border-bottom:2px solid #E2E0DA;display:flex;gap:7px;align-items:center;padding:0 12px}.win .bar i{width:9px;height:9px;border-radius:50%;background:#D4D2CB;display:block}
.win .body{padding:16px;display:grid;gap:11px;width:200px}.ph{background:#ECEAE4;border-radius:6px;height:13px}.ph.h{height:24px;width:70%}.ph.img{height:76px;background:linear-gradient(135deg,#E7E3D8,#D9D4C7)}.ph.s{width:45%}
.arrow{font-size:40px;color:#B8B6B0}
.layers{border:2px solid #E2E0DA;border-radius:16px;background:#fff;font:13px/1.2 ui-monospace,Menlo,monospace;padding:12px 0;box-shadow:0 30px 80px rgba(0,0,0,.08);width:190px}.layers div{padding:7px 14px;display:flex;gap:9px;align-items:center;color:#333}.layers div:before{content:"#";color:#999;width:11px}.layers .t:before{content:"T"}.layers .i:before{content:"▣"}.layers .d1{padding-left:30px}.layers .d2{padding-left:46px}
.foot{position:absolute;bottom:96px;left:140px;font-size:26px;color:#777}
</style>
<div class="brand"><img src="icon.svg"> htmlimport</div>
<div class="wrap">
  <div><h1>Any web page, rebuilt as real Figma layers.</h1><p>Paste a URL. Get editable text with the page's fonts, images, SVG and spacing — at desktop, tablet and phone widths.</p></div>
  <div class="fig">
    <div class="win"><div class="bar"><i></i><i></i><i></i></div><div class="body"><span class="ph h"></span><span class="ph"></span><span class="ph s"></span><span class="ph img"></span><span class="ph"></span><span class="ph s"></span></div></div>
    <div class="arrow">→</div>
    <div class="layers"><div>Page · 1440</div><div class="d1">Header</div><div class="d2 t">Nav item</div><div class="d1">Hero</div><div class="d2 t">Headline</div><div class="d2 t">Body copy</div><div class="d2 i">Product image</div><div class="d1">Footer</div></div>
  </div>
</div>
<div class="foot">htmlimport.com · HTML to layers for Figma</div>
